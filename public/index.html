<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do you like?</title>

  <!-- Space Mono for Glitch Particles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #101113;
      --bg-surface: #16181a;
      --border-color: #ffffff;

      --cursor-bg: rgba(255, 255, 255, 0.16);
      --cursor-border: rgba(255, 255, 255, 0.55);
      --cursor-blur: 6px;

      --font-serif: "Times New Roman", Times, serif;
      --font-mono: 'Space Mono', monospace;
    }

    /* Zero rounded corners */
    *:not(.custom-cursor), *:not(.custom-cursor)::before, *:not(.custom-cursor)::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    *, *::before, *::after, html, body, a, button, input {
      cursor: none !important;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg-primary);
    }

    body {
      color: #ffffff;
      font-family: var(--font-serif);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      padding: clamp(24px, 4.5vh, 50px) clamp(24px, 5vw, 70px);
      text-align: left;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .main-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(36px, 5.5vh, 64px);
      font-weight: bold;
      letter-spacing: normal;
      color: #ffffff;
      margin-bottom: 2.5vh;
      text-align: left;
    }

    .container {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: clamp(20px, 3.5vw, 55px);
      width: auto;
      max-width: 100%;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .choice-title-link {
      text-decoration: none;
      color: #ffffff;
      display: inline-block;
      margin-bottom: 1.5vh;
    }

    .choice h2 {
      font-family: var(--font-serif);
      font-size: clamp(24px, 4vh, 44px);
      font-weight: bold;
      letter-spacing: normal;
      color: #ffffff;
      margin: 0;
      text-align: left;
    }

    .choice-img-link {
      display: block;
      line-height: 0;
      text-decoration: none;
    }

    .choice img {
      width: min(24vw, 44vh);
      height: min(24vw, 44vh);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid #ffffff;
      background-color: var(--bg-surface);
      display: block;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    @media (max-width: 768px) {
      .choice img {
        width: min(40vw, 36vh);
        height: min(40vw, 36vh);
      }
    }

    footer {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      margin-top: auto;
      padding-top: 4vh;
      width: 100%;
    }

    .footer-logo-link {
      display: inline-block;
      line-height: 0;
      text-decoration: none;
    }

    .footer-logo {
      height: clamp(30px, 5.5vh, 55px);
      width: auto;
      max-width: 60vw;
      object-fit: contain;
      filter: none;
      opacity: 1;
      display: block;
    }

    /* Custom Cursor */
    .custom-cursor {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      background-color: var(--cursor-bg);
      -webkit-backdrop-filter: blur(var(--cursor-blur));
      backdrop-filter: blur(var(--cursor-blur));
      transform: translate(-18px, -18px);
      transition: opacity 0.15s ease,
                  backdrop-filter 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  -webkit-backdrop-filter 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease;
      border: 1px solid transparent;
      will-change: transform, width, height, border-radius, left, top;
    }

    .custom-cursor.cursor-morph,
    .custom-cursor.cursor-small {
      background-color: transparent !important;
      border: 1.25px solid var(--cursor-border) !important;
      -webkit-backdrop-filter: blur(0px) brightness(1) !important;
      backdrop-filter: blur(0px) brightness(1) !important;
      border-radius: 0px !important;
    }

    .custom-cursor.cursor-hide {
      opacity: 0 !important;
    }

    /* Glitch Trail Container */
    .glitch-mouse-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99990;
      overflow: hidden;
    }

    .glitch-mouse-glyph {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--rotation, 0deg)) scale(var(--scale, 1));
      opacity: 0;
      transition: opacity 0.15s ease-out;
      user-select: none;
      will-change: transform, opacity;
    }

    /* Mobile & Touch Fallback */
    @media (pointer: coarse) and (hover: none) {
      *, *::before, *::after, html, body, a, button, input {
        cursor: auto !important;
      }
      .custom-cursor {
        display: none !important;
      }
    }
  </style>
</head>
<body class="glitch-mouse-trail">

  <div class="custom-cursor"></div>

  <div class="main-section">
    <h1>do you like?</h1>

    <div class="container">
      <!-- Left Side: Dogs -->
      <div class="choice">
        <a href="/dog" class="choice-title-link cursor-hover">
          <h2>Dogs</h2>
        </a>
        <a href="/dog" class="choice-img-link cursor-hover">
          <img src="dog.jpg" alt="Dog" class="cursor-hover">
        </a>
      </div>

      <!-- Right Side: Cats -->
      <div class="choice">
        <a href="/cat" class="choice-title-link cursor-hover">
          <h2>Cats</h2>
        </a>
        <a href="/cat" class="choice-img-link cursor-hover">
          <img src="cat.jpg" alt="Cat" class="cursor-hover">
        </a>
      </div>
    </div>
  </div>

  <footer>
    <a href="/" class="footer-logo-link cursor-hover">
      <img src="ilyambr.png" alt="ilyambr" class="footer-logo cursor-hover">
    </a>
  </footer>

  <script src="/backtrack/cursor.js"></script>
  <script src="/backtrack/glitch-trail.js"></script>
</body>
</html>
