<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do you like?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vh 3vw;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 5.5vh, 64px);
      font-weight: normal;
      margin-bottom: 2vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 4vw, 70px);
      width: 92vw;
      max-width: 1400px;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #000000;
      cursor: pointer;
    }

    .choice h2 {
      font-size: clamp(24px, 4vh, 44px);
      font-weight: normal;
      margin-bottom: 1.5vh;
    }

    .choice img {
      width: min(42vw, 56vh);
      height: min(42vw, 56vh);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid #000000;
      background-color: #f0f0f0;
      display: block;
    }

    .choice:hover h2 {
      text-decoration: underline;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2.5vh;
    }

    .footer-logo {
      height: clamp(30px, 5.5vh, 55px);
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      filter: invert(1);
      opacity: 0.85;
      display: block;
    }
  </style>
</head>
<body>

  <h1>do you like?</h1>

  <div class="container">
    <!-- Left Side: Dogs -->
    <a href="/dog" class="choice">
      <h2>Dogs</h2>
      <img src="dog.jpg" alt="Dog">
    </a>

    <!-- Right Side: Cats -->
    <a href="/cat" class="choice">
      <h2>Cats</h2>
      <img src="cat.jpg" alt="Cat">
    </a>
  </div>

  <footer>
    <img src="ilyambr.png" alt="ilyambr" class="footer-logo">
  </footer>

</body>
</html>
