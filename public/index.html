<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do you like?</title>

  <!-- Space Mono for Glitch Particles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #101113;
      --bg-surface: #16181a;

      /* Backtrack slate/silver theme color */
      --text-color: #aeb4bd;
      --text-hover: #ffffff;
      --border-color: rgba(174, 180, 189, 0.35);
      --border-hover: #aeb4bd;

      --cursor-bg: rgba(174, 180, 189, 0.18);
      --cursor-border: #aeb4bd;
      --cursor-blur: 6px;

      --font-serif: "Times New Roman", Times, serif;
      --font-mono: 'Space Mono', monospace;
    }

    /* Zero rounded corners */
    *:not(.custom-cursor), *:not(.custom-cursor)::before, *:not(.custom-cursor)::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    *, *::before, *::after, html, body, a, button, input {
      cursor: none !important;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-primary);
    }

    body {
      color: var(--text-color);
      font-family: var(--font-serif);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vh 3vw;
      text-align: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(36px, 5.5vh, 64px);
      font-weight: bold;
      letter-spacing: normal;
      color: var(--text-color);
      margin-bottom: 2vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 4vw, 70px);
      width: 92vw;
      max-width: 1400px;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .choice-title-link {
      text-decoration: none;
      color: var(--text-color);
      display: inline-block;
      margin-bottom: 1.5vh;
      transition: color 0.2s ease;
    }

    .choice-title-link:hover h2 {
      color: var(--text-hover);
    }

    .choice h2 {
      font-family: var(--font-serif);
      font-size: clamp(24px, 4vh, 44px);
      font-weight: bold;
      letter-spacing: normal;
      color: var(--text-color);
      margin: 0;
      transition: color 0.2s ease;
    }

    .choice-img-link {
      display: block;
      line-height: 0;
      text-decoration: none;
    }

    .choice img {
      width: min(42vw, 56vh);
      height: min(42vw, 56vh);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      display: block;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .choice-img-link:hover img {
      border-color: var(--border-hover);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    footer {
      position: absolute;
      bottom: clamp(8px, 1.6vh, 20px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .footer-logo {
      display: block;
      height: clamp(26px, 4.2vh, 46px);
      width: clamp(75px, 10vw, 130px);
      background-color: var(--text-color);
      -webkit-mask: url('/ilyambr.png') no-repeat center center / contain;
      mask: url('/ilyambr.png') no-repeat center center / contain;
      pointer-events: none;
    }

    /* Custom Cursor */
    .custom-cursor {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      background-color: var(--cursor-bg);
      -webkit-backdrop-filter: blur(var(--cursor-blur));
      backdrop-filter: blur(var(--cursor-blur));
      transform: translate(-18px, -18px);
      transition: opacity 0.15s ease,
                  backdrop-filter 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  -webkit-backdrop-filter 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease;
      border: 1px solid transparent;
      will-change: transform, width, height, border-radius, left, top;
    }

    .custom-cursor.cursor-morph,
    .custom-cursor.cursor-small {
      background-color: transparent !important;
      border: 1.25px solid var(--cursor-border) !important;
      -webkit-backdrop-filter: blur(0px) brightness(1) !important;
      backdrop-filter: blur(0px) brightness(1) !important;
      border-radius: 0px !important;
    }

    .custom-cursor.cursor-hide {
      opacity: 0 !important;
    }

    /* Glitch Trail Container */
    .glitch-mouse-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99990;
      overflow: hidden;
    }

    .glitch-mouse-glyph {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-color);
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--rotation, 0deg)) scale(var(--scale, 1));
      opacity: 0;
      transition: opacity 0.15s ease-out;
      user-select: none;
      will-change: transform, opacity;
    }

    /* Mobile & Touch Fallback */
    @media (pointer: coarse) and (hover: none) {
      *, *::before, *::after, html, body, a, button, input {
        cursor: auto !important;
      }
      .custom-cursor {
        display: none !important;
      }
    }
  </style>
</head>
<body class="glitch-mouse-trail">

  <div class="custom-cursor"></div>

  <h1>do you like?</h1>

  <div class="container">
    <!-- Left Side: Dogs -->
    <div class="choice">
      <a href="/dog" class="choice-title-link cursor-hover">
        <h2>Dogs</h2>
      </a>
      <a href="/dog" class="choice-img-link cursor-hover">
        <img src="dog.jpg" alt="Dog" class="cursor-hover">
      </a>
    </div>

    <!-- Right Side: Cats -->
    <div class="choice">
      <a href="/cat" class="choice-title-link cursor-hover">
        <h2>Cats</h2>
      </a>
      <a href="/cat" class="choice-img-link cursor-hover">
        <img src="cat.jpg" alt="Cat" class="cursor-hover">
      </a>
    </div>
  </div>

  <footer class="no-cursor-snap">
    <div class="footer-logo no-cursor-snap" aria-label="ilyambr"></div>
  </footer>

  <script src="/backtrack/cursor.js"></script>
  <script src="/backtrack/glitch-trail.js"></script>
</body>
</html>
